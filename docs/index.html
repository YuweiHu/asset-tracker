<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="資產" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
    <link rel="shortcut icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <script>
      // 在 CSS 套用前先設好主題，避免深色模式重整時閃一下白
      try {
        var s = JSON.parse(localStorage.getItem("assetTracker.v1"));
        if (s && s.settings && s.settings.theme === "dark") {
          document.documentElement.dataset.theme = "dark";
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.content = "#1e293b";
        }
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="styles.css" />
    <title>資產管理</title>
  </head>
  <body>
    <div class="shell">
      <!-- 側欄：桌面固定、手機漢堡抽屜 -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">資產管理</div>
        <nav class="sidebar-nav">
          <button class="nav-item active" data-view="assets">
            <span data-icon="pie-chart" data-size="18"></span>資產追蹤
          </button>
          <button class="nav-item" data-view="futures">
            <span data-icon="trending-up" data-size="18"></span>期貨計算機
          </button>
        </nav>
      </aside>
      <div class="scrim" id="sidebarScrim"></div>

      <div class="content">
        <!-- ===== 視圖：資產追蹤 ===== -->
        <section class="view active" id="view-assets" data-view="assets">
          <!-- 頂部總資產 -->
          <header class="topbar">
            <div class="topbar-row">
              <button class="hamburger" aria-label="開啟選單">
                <span data-icon="menu" data-size="22"></span>
              </button>
              <div class="total-label" id="totalLabel">總資產</div>
              <button class="settings-btn" id="settingsBtn">
                <span data-icon="settings" data-size="20"></span>
              </button>
            </div>
      <div class="total-value" id="totalValue">—</div>
      <div class="total-sub" id="totalPnl"></div>
      <button class="refresh-btn" id="refreshBtn">
        <span data-icon="refresh-cw" data-size="16"></span
        ><span class="btn-label">更新資產</span>
      </button>
      <div class="sync-line" id="syncStatus"></div>
    </header>

    <main>
      <!-- 圖表卡片：左右滑動切換 配置圓餅圖 / 資產走勢 -->
      <section class="card chart-card">
        <div class="carousel" id="chartCarousel">
          <div class="slide">
            <h2>資產配置</h2>
            <div class="chart-wrap"><canvas id="allocChart"></canvas></div>
            <div class="legend" id="allocLegend"></div>
          </div>
          <div class="slide">
            <h2>台股配置</h2>
            <div class="chart-wrap"><canvas id="twChart"></canvas></div>
            <div class="legend" id="twLegend"></div>
          </div>
          <div class="slide">
            <h2>美股配置</h2>
            <div class="chart-wrap"><canvas id="usChart"></canvas></div>
            <div class="legend" id="usLegend"></div>
          </div>
          <div class="slide">
            <div class="trend-head">
              <h2>資產走勢</h2>
              <div class="range-toggle" id="rangeToggle">
                <button data-days="30">30天</button>
                <button data-days="90" class="active">90天</button>
                <button data-days="3650">全部</button>
              </div>
            </div>
            <div class="chart-wrap"><canvas id="trendChart"></canvas></div>
            <div class="trend-meta" id="trendMeta"></div>
          </div>
        </div>
        <div class="dots" id="chartDots">
          <i class="active"></i><i></i><i></i><i></i>
        </div>
      </section>

      <!-- 持股列表 -->
      <section class="card" id="holdingsList"></section>
    </main>

          <!-- 浮動新增鈕 -->
          <button class="fab" id="fabAdd">
            <span data-icon="plus" data-size="26"></span>
          </button>
        </section>

        <!-- ===== 視圖：期貨計算機 ===== -->
        <section class="view" id="view-futures" data-view="futures">
          <header class="topbar">
            <div class="topbar-row">
              <button class="hamburger" aria-label="開啟選單">
                <span data-icon="menu" data-size="22"></span>
              </button>
              <div class="total-label">期貨計算機</div>
              <span class="hamburger" aria-hidden="true" style="visibility: hidden"></span>
            </div>
          </header>
          <main>
            <section class="card fc">
              <h2>保證金追繳計算機</h2>
              <label
                ><span data-icon="search" data-size="14" class="lbl-icon"></span
                >期貨商品（選填，帶入現價與乘數）
                <input
                  id="fcFutSearch"
                  placeholder="輸入名稱，如 小型臺指、聯發科"
                />
              </label>
              <div class="fut-results" id="fcFutResults"></div>
              <div class="fut-selected" id="fcFutSelected"></div>
              <p class="hint" id="fcCurPrice"></p>
              <p class="hint" id="fcMarginInfo"></p>

              <div class="setting-row">
                <span class="setting-label">方向</span>
                <div class="ccy-toggle" id="fcDir">
                  <button data-dir="long" class="active">做多</button>
                  <button data-dir="short">做空</button>
                </div>
              </div>

              <label
                >成本價（進場價）
                <input
                  id="fcEntry"
                  type="number"
                  inputmode="decimal"
                  placeholder="例如 18000"
              /></label>
              <label
                >口數
                <input
                  id="fcLots"
                  type="number"
                  inputmode="numeric"
                  placeholder="1"
              /></label>
              <label
                >每口乘數（選商品自動帶入，可改）
                <input
                  id="fcMult"
                  type="number"
                  inputmode="decimal"
                  placeholder="小台=50 ・ 大台=200"
              /></label>
              <label
                >投入保證金（你要放的錢，NT$）
                <input
                  id="fcDeposit"
                  type="number"
                  inputmode="numeric"
                  placeholder="選商品自動帶入原始保證金，可調高更安全"
              /></label>
            </section>

            <section class="card fc-result" id="fcResult">
              <div class="fc-h-label">追繳保證金價（margin call）</div>
              <div class="fc-h-value" id="fcCallPrice">—</div>
              <div class="fc-h-dist" id="fcCallDist"></div>
              <div class="fc-rows">
                <div class="fc-row">
                  <span>強制平倉 / 歸零價</span>
                  <span id="fcLiqPrice">—</span>
                </div>
                <div class="fc-row">
                  <span>距強平</span><span id="fcLiqDist">—</span>
                </div>
                <div class="fc-row">
                  <span>有效槓桿</span><span id="fcEffLev">—</span>
                </div>
                <div class="fc-row">
                  <span>維持保證金（追繳門檻）</span><span id="fcMaintShow">—</span>
                </div>
                <div class="fc-row">
                  <span>原始保證金（最低投入）</span><span id="fcInitShow">—</span>
                </div>
              </div>
              <p class="hint" style="margin-top: 12px">
                追繳價＝權益（投入＋損益）跌破期交所維持保證金的價位。維持／原始保證金取自期交所即時資料；投入愈多、追繳價愈遠。
              </p>
            </section>
          </main>
        </section>
      </div>
      <!-- /.content -->
    </div>
    <!-- /.shell -->

    <!-- 新增/編輯彈窗 -->
    <div class="modal-backdrop" id="formModal">
      <div class="modal">
        <h3 id="formTitle">新增資產</h3>
        <div class="field">
          <span class="field-label">類別</span>
          <div id="fType"></div>
        </div>
        <div class="field-stock">
          <label
            >股票代號
            <input
              id="fSymbol"
              placeholder="美股: AAPL ／ 台股: 2330"
              autocapitalize="characters"
          /></label>
          <label
            >持有股數
            <input
              id="fShares"
              type="number"
              inputmode="decimal"
              placeholder="例如 10"
          /></label>
          <label
            >平均成本（選填，每股）
            <input
              id="fAvgCost"
              type="number"
              inputmode="decimal"
              placeholder="留空則不算損益"
          /></label>
        </div>
        <div class="field-cash">
          <label
            >帳戶名稱 <input id="fName" placeholder="例如 台新台幣"
          /></label>
          <div class="field">
            <span class="field-label">幣別</span>
            <div id="fCurrency"></div>
          </div>
          <label
            >金額
            <input
              id="fAmount"
              type="number"
              inputmode="decimal"
              placeholder="例如 50000"
          /></label>
        </div>
        <div class="field-futures">
          <label
            ><span data-icon="search" data-size="14" class="lbl-icon"></span
            >商品搜尋
            <input
              id="fFutSearch"
              placeholder="輸入名稱，如 聯發科、小型臺指"
            />
          </label>
          <div class="fut-results" id="fFutResults"></div>
          <div class="fut-selected" id="fFutSelected"></div>
          <label
            >口數（做空填負數，如 -1）
            <input
              id="fFutLots"
              type="number"
              inputmode="numeric"
              placeholder="例如 1"
          /></label>
          <label
            >每口乘數（每點/每股價值，會自動帶入可改）
            <input
              id="fFutMult"
              type="number"
              inputmode="decimal"
              placeholder="小型個股=100 ・ 小台=50"
          /></label>
          <label
            >進場價
            <input
              id="fFutEntry"
              type="number"
              inputmode="decimal"
              placeholder="你的成交價"
          /></label>
          <label
            >已存保證金（TWD）
            <input
              id="fFutMargin"
              type="number"
              inputmode="decimal"
              placeholder="這口投入的保證金"
          /></label>
        </div>
        <div class="modal-actions">
          <button class="btn-del" id="fDelete">
            <span data-icon="trash-2" data-size="16"></span>刪除
          </button>
          <div style="flex: 1"></div>
          <button class="btn-ghost" id="fCancel">取消</button>
          <button class="btn-primary" id="fSave">儲存</button>
        </div>
      </div>
    </div>

    <!-- 設定彈窗 -->
    <div class="modal-backdrop" id="settingsModal">
      <div class="modal">
        <h3>設定</h3>
        <div class="setting-row">
          <span class="setting-label">顯示幣別</span>
          <div class="ccy-toggle" id="ccyToggle">
            <button data-ccy="TWD" class="active">TWD</button>
            <button data-ccy="USD">USD</button>
          </div>
        </div>
        <div class="setting-row">
          <span class="setting-label">資產顯示</span>
          <div class="ccy-toggle" id="viewToggle">
            <button data-view="gross" class="active">總資產</button>
            <button data-view="net">淨資產</button>
          </div>
        </div>
        <div class="setting-row">
          <span class="setting-label">深色模式</span>
          <div class="ccy-toggle" id="themeToggle">
            <button data-theme="light" class="active">淺色</button>
            <button data-theme="dark">深色</button>
          </div>
        </div>
        <div class="backup-row">
          <button class="btn-ghost" id="sExport">匯出備份</button>
          <button class="btn-ghost" id="sImport">匯入備份</button>
          <input
            type="file"
            id="sImportFile"
            accept="application/json"
            hidden
          />
        </div>
        <p class="hint" id="fxLine"></p>
        <div class="backup-row">
          <button class="btn-ghost" id="logoutBtn">登出</button>
        </div>
        <div class="modal-actions">
          <div style="flex: 1"></div>
          <button class="btn-primary" id="sClose">完成</button>
        </div>
      </div>
    </div>

    <!-- 登入畫面 -->
    <div class="login-overlay" id="loginOverlay">
      <div class="login-card">
        <h1 class="login-title">資產管理</h1>
        <p class="login-sub">登入以同步你的資產</p>
        <input
          id="loginUser"
          class="login-input"
          placeholder="帳號"
          autocapitalize="off"
          autocorrect="off"
          autocomplete="username"
        />
        <input
          id="loginPass"
          class="login-input"
          type="password"
          placeholder="密碼"
          autocomplete="current-password"
        />
        <button class="btn-primary login-btn" id="loginBtn">登入</button>
        <p class="login-err" id="loginErr"></p>
      </div>
    </div>

    <script src="vendor/chart.umd.min.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
